<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Edit Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Edit Exam Details</h2>

    <form id="examForm">
        <label>Paper Link:</label>
        <input type="text" id="paperLink" required>

        <label>Exam Time (minutes):</label>
        <input type="number" id="examTime" required>

        <label>Paper Details:</label>
        <input type="text" id="paperDetails" required>

        <label>Deadline:</label>
        <input type="datetime-local" id="deadline" required>

        <button type="submit">Save Changes</button>
    </form>

    <script>
        // Redirect if not logged in
        if (localStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }

        // Load existing data
        fetch("exam-data.json")
            .then(res => res.json())
            .then(data => {
                document.getElementById("paperLink").value = data.paperLink;
                document.getElementById("examTime").value = data.examTime;
                document.getElementById("paperDetails").value = data.paperDetails;
                document.getElementById("deadline").value = data.deadline;
            });

        // Save updates
        document.getElementById("examForm").onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append("paperLink", document.getElementById("paperLink").value);
            formData.append("examTime", document.getElementById("examTime").value);
            formData.append("paperDetails", document.getElementById("paperDetails").value);
            formData.append("deadline", document.getElementById("deadline").value);

            fetch("update.php", {
                method: "POST",
                body: formData
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
            });
        }
    </script>
</body>
</html>
